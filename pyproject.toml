[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "digest"
version = "0.1.0"
description = "AI News Digest POC: fetch -> process -> generate -> render"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"digest.render" = ["templates/*.j2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["network: hits the internet (skipped by default; run with -m network)"]
addopts = "-m 'not network'"
